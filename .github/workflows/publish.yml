# Build, scan and publish the verified-login image to GHCR.
name: publish

on:
  push:
    branches: [main]
    paths: ["Dockerfile", "Dockerfile.ml", "entrypoint.sh", "gpu-gate", "motd", "issue", ".github/workflows/publish.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts parse
        run: |
          sh -n gpu-gate
          sh -n entrypoint.sh
          bash -n install.sh
          bash -n uninstall.sh

      - name: Build timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally for the scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4

      - name: Scan (reports HIGH/CRITICAL; does not block)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true
        continue-on-error: true

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:latest
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:${{ github.sha }}

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The ML image lands around 15-20 GB and a runner has roughly 14 GB free
      # on the root disk, where Docker keeps its layers. These four directories
      # are preinstalled toolchains this build never touches.
      - name: Reclaim runner disk
        run: |
          echo "before: $(df -h / | awk 'NR==2{print $4}') free"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:  $(df -h / | awk 'NR==2{print $4}') free"

      - name: Build timestamp
        id: meta
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed straight from the build: loading a 20 GB image locally first
      # would need the disk twice over.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ml
          push: true
          build-args: |
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
            DOCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:cuda12.4-ml
            ghcr.io/${{ github.repository_owner }}/gpu-verified-image:ml
